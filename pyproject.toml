[project]
name = "story-weaver"
version = "0.1.0"
description = "LLM-driven multi-NPC interactive narrative backend"
requires-python = ">=3.9"
dependencies = [
  "eval-type-backport>=0.2,<1; python_version < '3.10'",
  "fastapi>=0.115,<1",
  "langgraph>=0.2.50,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.3,<1"]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/story_weaver"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
